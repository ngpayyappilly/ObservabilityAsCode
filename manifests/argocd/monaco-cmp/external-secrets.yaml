# ExternalSecret resources that pull Dynatrace credentials from Vault
# into Kubernetes Secrets consumed by the Monaco CMP sidecar.
# refreshInterval: 1h — short enough to pick up token rotation quickly.

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dynatrace-tenant-urls
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dynatrace-tenant-urls
    creationPolicy: Owner
    # Immutable: false so that URL changes in Vault propagate on next refresh
  data:
    - secretKey: dev-url
      remoteRef:
        key: secret/dynatrace/tenants
        property: dev-url
    - secretKey: staging-url
      remoteRef:
        key: secret/dynatrace/tenants
        property: staging-url
    - secretKey: prod-url
      remoteRef:
        key: secret/dynatrace/tenants
        property: prod-url

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dynatrace-api-tokens
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dynatrace-api-tokens
    creationPolicy: Owner
  data:
    - secretKey: dev-token
      remoteRef:
        key: secret/dynatrace/tokens
        property: dev-token
    - secretKey: staging-token
      remoteRef:
        key: secret/dynatrace/tokens
        property: staging-token
    - secretKey: prod-token
      remoteRef:
        key: secret/dynatrace/tokens
        property: prod-token
