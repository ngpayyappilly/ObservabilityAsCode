# CronJob: oac-drift-detector
# Runs every 6 hours post-cutover to detect drift between live Dynatrace state
# and the desired state tracked in Git / Argo CD.
# AUTO_REMEDIATE=true causes it to trigger an Argo CD hard-refresh on drift.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: oac-drift-detector
  namespace: sre-tools
  labels:
    app.kubernetes.io/part-of: dynatrace-oac
    app.kubernetes.io/component: drift-detector
spec:
  schedule: "0 */6 * * *"   # every 6 hours
  concurrencyPolicy: Forbid   # don't overlap runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0   # drift detection is not retried — next run is in 6h
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: dynatrace-oac
            app.kubernetes.io/component: drift-detector
          # No sidecar.istio.io/inject: "false" — Istio sidecar injection must remain active
        spec:
          restartPolicy: OnFailure
          serviceAccountName: oac-drift-detector
          containers:
            - name: drift-detector
              image: python:3.12-slim
              command: [sh, -c]
              args:
                - |
                  pip install requests --quiet
                  python /scripts/drift_detector.py
              env:
                - name: ARGOCD_SERVER
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-server-config
                      key: server-url
                - name: ARGOCD_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: argocd-drift-detector-token
                      key: token
                - name: SLACK_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: slack-webhook-secret
                      key: webhook-url
                - name: AUTO_REMEDIATE
                  value: "true"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: drift-detector-script
                  mountPath: /scripts
          volumes:
            - name: drift-detector-script
              configMap:
                name: drift-detector-script
                defaultMode: 0755
