apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynatracenotifications.oac.YOUR_ORG.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: oac.YOUR_ORG.io
  names:
    kind: DynatraceNotification
    listKind: DynatraceNotificationList
    plural: dynatracenotifications
    singular: dynatracenotification
    shortNames:
      - dtnotif
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .spec.environment
        - name: Channel
          type: string
          jsonPath: .spec.channel
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [environment, alertingProfileRef, channel, secretRef]
              properties:
                environment:
                  type: string
                  enum: [dev, staging, perf, prod]
                alertingProfileRef:
                  type: string
                  description: Dynatrace alerting profile ID (from Terraform output alerting_profile_ids).
                channel:
                  type: string
                  enum: [slack, msteams, pagerduty, splunkOncall]
                  description: |
                    Notification destination type.
                    Required Secret keys per channel:
                      slack:        webhook-url
                      msteams:      webhook-url
                      pagerduty:    service-key
                      splunkOncall: routing-key, api-key
                secretRef:
                  type: object
                  required: [name]
                  description: Kubernetes Secret in the same namespace containing channel credentials.
                  properties:
                    name:
                      type: string
                channelName:
                  type: string
                  description: Display name or channel identifier (e.g. "#alerts-prod" for Slack, "Prod Alerts" for MS Teams).
            status:
              type: object
              properties:
                dynatraceId:
                  type: string
                lastSyncTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
