apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynatraceslos.oac.YOUR_ORG.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: oac.YOUR_ORG.io
  names:
    kind: DynatraceSLO
    listKind: DynatraceSLOList
    plural: dynatraceslos
    singular: dynatraceslo
    shortNames:
      - dtslo
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .spec.environment
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Target
          type: number
          jsonPath: .spec.target
        - name: Current
          type: number
          jsonPath: .status.currentValue
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [environment, serviceSelector, type, target]
              properties:
                environment:
                  type: string
                  enum: [dev, staging, perf, prod]
                  description: Target Dynatrace tenant.
                serviceSelector:
                  type: object
                  description: Identifies the Dynatrace service entity.
                  properties:
                    backstageId:
                      type: string
                      description: Backstage catalog entity name. Controller resolves to DT SERVICE entity via backstage-id auto-tag.
                    serviceName:
                      type: string
                      description: Exact Dynatrace service name. Use if DT name differs from Backstage ID.
                    managementZone:
                      type: string
                      description: Scopes entity search. Defaults to env:<environment>.
                type:
                  type: string
                  enum: [availability, latency]
                  description: SLO measurement strategy.
                target:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: SLO target percentage (e.g. 99.9).
                warning:
                  type: number
                  description: Warning threshold. Defaults to target - 0.5.
                window:
                  type: string
                  default: "-1w"
                  description: Evaluation timeframe (e.g. -1w, -30d).
                latencyThresholdMs:
                  type: integer
                  description: p99 latency threshold in milliseconds. Required when type is latency.
            status:
              type: object
              properties:
                dynatraceId:
                  type: string
                  description: SLO ID assigned by Dynatrace on creation.
                currentValue:
                  type: number
                  description: Most recently observed SLO value (%).
                errorBudgetRemaining:
                  type: number
                  description: Remaining error budget in minutes.
                lastSyncTime:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
