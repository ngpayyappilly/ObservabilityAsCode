apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynatrace-operator
rules:
  # Manage all 4 CRD types
  - apiGroups: [oac.YOUR_ORG.io]
    resources:
      - dynatraceslos
      - dynatracealerts
      - dynatracenotifications
      - dynatracedashboards
    verbs: [get, list, watch, create, update, patch, delete]

  # Update status subresources
  - apiGroups: [oac.YOUR_ORG.io]
    resources:
      - dynatraceslos/status
      - dynatracealerts/status
      - dynatracenotifications/status
      - dynatracedashboards/status
    verbs: [get, update, patch]

  # Manage finalizers
  - apiGroups: [oac.YOUR_ORG.io]
    resources:
      - dynatraceslos/finalizers
      - dynatracealerts/finalizers
      - dynatracenotifications/finalizers
      - dynatracedashboards/finalizers
    verbs: [update]

  # Read Secrets for DT credentials (namespace-scoped via RoleBinding)
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]

  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]

  # Events for audit trail
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
