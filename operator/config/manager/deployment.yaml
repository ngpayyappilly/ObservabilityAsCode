apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynatrace-operator
  namespace: sre-tools
  labels:
    app.kubernetes.io/name: dynatrace-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 2    # HA — leader election ensures only one reconciles at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: dynatrace-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynatrace-operator
        # Istio sidecar injection stays enabled — no inject:false annotation
    spec:
      serviceAccountName: dynatrace-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: manager
          image: YOUR_REGISTRY/dynatrace-operator:latest
          args:
            - --leader-elect=true
            - --namespace=sre-tools
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          # No env var credentials here — reads from Secrets via k8s client
          # (BuildDTClients reads dynatrace-tenant-urls and dynatrace-api-tokens)
      terminationGracePeriodSeconds: 10
